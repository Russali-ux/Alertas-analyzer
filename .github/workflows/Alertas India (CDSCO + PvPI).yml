name: Alertas India (CDSCO + PvPI) → Supabase

on:
  schedule:
    - cron: '0 6 * * *'      # 06:00 UTC = 01:00 hora de Lima, diario
  workflow_dispatch: {}

concurrency:
  group: alertas-india
  cancel-in-progress: false

jobs:
  scrape-y-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml pdfplumber python-dateutil
      - name: Raspar CDSCO
        run: python scraper_cdsco.py
        continue-on-error: true
      - name: Raspar PvPI
        run: python scraper_pvpi.py
        continue-on-error: true
      - name: Sync a Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python india_sync_supabase.py
      - name: Commit de los JSON actualizados
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cdsco_data.json data/pvpi_data.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(india): actualización automática $(date -u +%F)"
            git push
          fi