name: FDA AEMS - sync mensual (OneDrive -> repo -> Supabase)

on:
  schedule:
    # Día 3 de cada mes ~09:00 UTC (04:00 hora Perú) = cada ~30 días.
    # El día 3 (no el 1) da margen a que la FDA termine de publicar el
    # reporte trimestral cuando corresponde a inicio de trimestre, y a que
    # la corrida local del scraper (vía skill fda-aems-monitor) ya haya
    # dejado el JSON nuevo en OneDrive.
    - cron: '0 9 3 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configurar rclone (OneDrive)
        env:
          RCLONE_CONF_CONTENT: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF_CONTENT" > ~/.config/rclone/rclone.conf

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4 --quiet

      - name: 0. Traer fda_aems_data.json de OneDrive
        run: python3 scripts_fetch_aems_from_onedrive.py

      - name: 1. Sincronizar con Supabase (sin scrapear, ya viene de OneDrive)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 fda_aems_sync_from_json.py --db data/fda_aems_data.json

      - name: Commitear JSON acumulado actualizado
        run: |
          git config user.name "fda-aems-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/fda_aems_data.json
          git diff --cached --quiet && echo "Sin cambios en el JSON" || \
            git commit -m "chore(fda-aems): sync mensual desde OneDrive [skip ci]"
          git push
