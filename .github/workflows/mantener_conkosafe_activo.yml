# Mantiene "despierta" la app ConkoSafe IA en Vercel para evitar arranques en frío.
# Visita la página de acceso cada 10 minutos en horario laboral de Lima.
# Corre en este repo público porque aquí los minutos de GitHub Actions son gratuitos.

name: Mantener ConkoSafe activo

on:
  schedule:
    # Cada 10 min, lunes a viernes, 07:00–19:59 hora de Lima (12:00–00:59 UTC)
    - cron: '*/10 12-23 * * 1-5'
    - cron: '*/10 0 * * 2-6'
  workflow_dispatch:

permissions: {}

concurrency:
  group: mantener-conkosafe-activo
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Visitar ConkoSafe
        run: |
          curl -sS -o /dev/null --max-time 60 \
            -w "HTTP %{http_code} en %{time_total}s\n" \
            https://conkosafe-ia.vercel.app/ || true
