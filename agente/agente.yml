name: 🤖 Agente ConkoSafe IA (tareas desde el tablero)

# Copiar a .github/workflows/agente.yml (los workflows se crean a mano en GitHub).
#
# Se despierta de 3 formas:
#   1. repository_dispatch  -> lo dispara la Edge Function agente-despachar al enviar una tarea (≈30 s)
#   2. schedule cada 15 min -> red de seguridad: procesa lo que haya quedado pendiente
#   3. workflow_dispatch    -> manual, opcionalmente con un tarea_id
on:
  repository_dispatch:
    types: [agente_tarea]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      tarea_id:
        description: 'UUID de la tarea (vacío = todas las pendientes)'
        required: false

permissions:
  contents: read
  actions: write      # para que el agente pueda disparar un scraper si se lo pides

concurrency:
  group: agente-${{ github.event.client_payload.tarea_id || github.event.inputs.tarea_id || 'pendientes' }}
  cancel-in-progress: false

jobs:
  agente:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: agente

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install --quiet requests anthropic

      - name: Ejecutar agente
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENTE_MODELO: ${{ vars.AGENTE_MODELO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TAREA: ${{ github.event.client_payload.tarea_id || github.event.inputs.tarea_id }}
        run: |
          if [ -n "$TAREA" ]; then
            python agente/agente.py --tarea "$TAREA"
          else
            python agente/agente.py --pendientes
          fi
